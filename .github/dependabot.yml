version: 2
updates:
  # One grouped PR per ecosystem a month instead of one PR per package.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # requirements.txt uses ">=" floors; only raise one when the range would exclude a new release.
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 2
