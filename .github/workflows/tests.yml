name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Tests cover data prep, metrics and calibration; they don't need torch/GPU.
      - run: pip install numpy pandas scipy scikit-learn pillow pyyaml ensemble-boxes pytest fastapi httpx python-multipart matplotlib ruff
      - run: ruff check .
      - run: python -m pytest -q
